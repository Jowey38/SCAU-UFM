name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, feat/m230-stage-record]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: linux-gcc
            triplet: x64-linux
          - os: windows-2022
            preset: windows-msvc
            triplet: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential pkg-config

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  golden-suite-gate:
    name: golden-suite (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: linux-gcc
            triplet: x64-linux
          - os: windows-2022
            preset: windows-msvc
            triplet: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential pkg-config

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: GoldenSuite gate
        run: ctest --preset ${{ matrix.preset }} -L golden --output-on-failure

  # Real D-Flow FM phase gateway (G11/G16/G17/G18 + checkpoint reload).
  # Requires a governed self-hosted runner that provides the licensed runtime:
  #   - runner labels: [self-hosted, windows, dflowfm]
  #   - repo variable SCAU_DFLOWFM_LIBRARY -> real dflowfm.dll on the runner
  #     (dependent runtime DLLs beside it)
  #   - repo variable SCAU_DFLOWFM_VCPKG_ROOT -> bootstrapped vcpkg on the runner
  #   - VS2022 + CMake installed, short workspace path (MSVC MAX_PATH)
  # The job stays skipped until the repository variable SCAU_DFLOWFM_RUNNER is
  # set to 'enabled'; manifest ci_gate for these goldens is promoted only after
  # this job runs green on master (stability protocol: represented-in-CI).
  real-dflowfm-golden:
    name: real-dflowfm-golden
    if: ${{ vars.SCAU_DFLOWFM_RUNNER == 'enabled' }}
    runs-on: [self-hosted, windows, dflowfm]
    # Runner-provided paths come in as repository variables so the workflow
    # never hard-codes machine layout and the runner service needs no
    # machine-level env. bash avoids restrictive PowerShell script policies.
    env:
      VCPKG_ROOT: ${{ vars.SCAU_DFLOWFM_VCPKG_ROOT }}
      SCAU_DFLOWFM_LIBRARY: ${{ vars.SCAU_DFLOWFM_LIBRARY }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build real golden targets
        run: >
          cmake --build --preset windows-msvc --target
          test_dflowfm_river_steady
          test_dflowfm_lateral_response
          test_dual_engine_shared_cell_real_both
          test_tri_coupling_real_minimal
          test_dflowfm_checkpoint_reload
          test_surface2d_tri_coupling_real

      - name: Run real D-Flow FM phase gateway
        run: tools/dflowfm/run_real_goldens.sh build/windows-msvc Debug

  goldensuite-manifest-check:
    name: manifest-completeness
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GoldenSuite manifest completeness
        shell: bash
        run: python3 tests/golden/suite_manifest/check_manifest.py

  spike-isolation-check:
    name: spike-isolation-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce spike-spec §2 / §3.3 isolation invariants
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::M30 spike-isolation invariant violated: $1"
            exit 1
          }

          echo "--- Invariant 1: spike must not reference main repo symbols"
          if grep -rnE "scau::coupling|scau::surface|scau::mesh|scau::stcf" spikes/ ; then
              fail "spike references scau:: namespace (spike-spec §2)"
          fi
          if grep -rn "libs/coupling" spikes/ ; then
              fail "spike references libs/coupling path (spike-spec §2)"
          fi
          if grep -rn "libs/surface2d" spikes/ ; then
              fail "spike references libs/surface2d path (spike-spec §2)"
          fi

          echo "--- Invariant 2: main CMake graph must not consume spike targets"
          if grep -nE "add_subdirectory\s*\(\s*spikes" CMakeLists.txt ; then
              fail "root CMakeLists.txt calls add_subdirectory(spikes...) (spike-spec §2)"
          fi
          for dir in libs apps tests cmake ; do
              if [ -d "$dir" ] && grep -rnE "add_subdirectory\s*\([^)]*spikes" "$dir" ; then
                  fail "$dir/ contains add_subdirectory targeting spikes/ (spike-spec §2)"
              fi
          done

          echo "--- Invariant 3: spike CMakeLists must not link main repo targets"
          if grep -rnE "scau::|GTest::" spikes/*/CMakeLists.txt ; then
              fail "spike CMakeLists links a main-repo CMake target (spike-spec §2)"
          fi

          echo "--- Invariant 4: no top-level vendor source under git tracking"
          if git ls-files | grep -E "^(Delft3D-main|Stormwater-Management-Model-develop)/" ; then
              fail "top-level vendor source committed (§3.3)"
          fi

          echo "OK all four spike-isolation invariants pass"

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, feat/m230-stage-record]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: linux-gcc
            triplet: x64-linux
          - os: windows-2022
            preset: windows-msvc
            triplet: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential pkg-config

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  golden-suite-gate:
    name: golden-suite (${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: linux-gcc
            triplet: x64-linux
          - os: windows-2022
            preset: windows-msvc
            triplet: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential pkg-config

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [ ! -d "$VCPKG_ROOT" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: GoldenSuite gate
        run: ctest --preset ${{ matrix.preset }} -L golden --output-on-failure

  # Real D-Flow FM phase gateway (G11/G16/G17/G18 + checkpoint reload).
  # Requires a governed self-hosted runner that provides the licensed runtime:
  #   - runner labels: [self-hosted, windows, dflowfm]
  #   - repo variable SCAU_DFLOWFM_LIBRARY -> real dflowfm.dll on the runner
  #     (dependent runtime DLLs beside it)
  #   - repo variable SCAU_DFLOWFM_VCPKG_ROOT -> bootstrapped vcpkg on the runner
  #   - VS2022 + CMake installed, short workspace path (MSVC MAX_PATH)
  # The job stays skipped until the repository variable SCAU_DFLOWFM_RUNNER is
  # set to 'enabled'; manifest ci_gate for these goldens is promoted only after
  # this job runs green on master (stability protocol: represented-in-CI).
  real-dflowfm-golden:
    name: real-dflowfm-golden
    if: ${{ vars.SCAU_DFLOWFM_RUNNER == 'enabled' }}
    runs-on: [self-hosted, windows, dflowfm]
    # Runner-provided paths come in as repository variables so the workflow
    # never hard-codes machine layout and the runner service needs no
    # machine-level env. bash avoids restrictive PowerShell script policies.
    env:
      VCPKG_ROOT: ${{ vars.SCAU_DFLOWFM_VCPKG_ROOT }}
      SCAU_DFLOWFM_LIBRARY: ${{ vars.SCAU_DFLOWFM_LIBRARY }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build real golden targets
        run: >
          cmake --build --preset windows-msvc --target
          test_dflowfm_river_steady
          test_dflowfm_lateral_response
          test_dual_engine_shared_cell_real_both
          test_tri_coupling_real_minimal
          test_dflowfm_checkpoint_reload
          test_dflowfm_external_net
          test_dflowfm_longrun_10000
          test_surface2d_tri_coupling_real

      - name: Run real D-Flow FM phase gateway
        run: tools/dflowfm/run_real_goldens.sh build/windows-msvc Debug

  # G9 deterministic CUDA golden on the governed GPU host (M285).
  # Requires the self-hosted runner with labels [self-hosted, windows, cuda]
  # (governed Quadro P2200 host; CUDA Toolkit 12.8 pinned via the VS toolset
  # in the windows-msvc-cuda preset — 13.3 remains rejected for this host,
  # see the M280/M284 evidence) and repo variable SCAU_CUDA_VCPKG_ROOT.
  # The job stays skipped until the repository variable SCAU_CUDA_RUNNER is
  # set to 'enabled'; manifest ci_gate for G9 is promoted only after three
  # consecutive green runs (same promotion pattern as G11/G16-G18 and G20).
  gpu-cuda-golden:
    name: gpu-cuda-golden
    if: ${{ vars.SCAU_CUDA_RUNNER == 'enabled' }}
    runs-on: [self-hosted, windows, cuda]
    env:
      VCPKG_ROOT: ${{ vars.SCAU_CUDA_VCPKG_ROOT }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare vcpkg binary cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Configure (CUDA 12.8 toolset, SCAU_ENABLE_CUDA=ON)
        run: cmake --preset windows-msvc-cuda

      - name: Build G9 golden
        run: cmake --build --preset windows-msvc-cuda --target test_cpu_gpu_deterministic_match

      - name: Run G9 deterministic golden (blocking)
        run: ctest --test-dir build/windows-msvc-cuda -C Debug -R '^test_cpu_gpu_deterministic_match$' --output-on-failure

  goldensuite-manifest-check:
    name: manifest-completeness
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GoldenSuite manifest completeness
        shell: bash
        run: python3 tests/golden/suite_manifest/check_manifest.py

  # B7 cross-platform determinism EVIDENCE lane (non-blocking): regenerates the
  # G30 preproc fixture on Linux with the governed python lock and records the
  # verdict (bitwise / 1e-12 / topology_differs). Promotion to a blocking gate
  # follows the B7 decision (third_party/manifest/gmsh.version).
  preproc-cross-platform:
    name: preproc-cross-platform (ubuntu, evidence)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install governed preproc python lock
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r third_party/manifest/preproc-python.lock
          sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1 libxrandr2 libgl1

      - name: Headless preproc unit tests
        shell: bash
        working-directory: python
        run: python -m unittest discover -s tests -t .

      - name: B7 regenerate G30 and compare
        shell: bash
        run: python tools/preproc/cross_platform_hash.py --out b7_evidence/linux-x86_64.json

      - name: Upload B7 evidence row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b7-evidence-linux-x86_64
          path: b7_evidence/

  spike-isolation-check:
    name: spike-isolation-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce spike-spec §2 / §3.3 isolation invariants
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            echo "::error::M30 spike-isolation invariant violated: $1"
            exit 1
          }

          echo "--- Invariant 1: spike must not reference main repo symbols"
          if grep -rnE "scau::coupling|scau::surface|scau::mesh|scau::stcf" spikes/ ; then
              fail "spike references scau:: namespace (spike-spec §2)"
          fi
          if grep -rn "libs/coupling" spikes/ ; then
              fail "spike references libs/coupling path (spike-spec §2)"
          fi
          if grep -rn "libs/surface2d" spikes/ ; then
              fail "spike references libs/surface2d path (spike-spec §2)"
          fi

          echo "--- Invariant 2: main CMake graph must not consume spike targets"
          if grep -nE "add_subdirectory\s*\(\s*spikes" CMakeLists.txt ; then
              fail "root CMakeLists.txt calls add_subdirectory(spikes...) (spike-spec §2)"
          fi
          for dir in libs apps tests cmake ; do
              if [ -d "$dir" ] && grep -rnE "add_subdirectory\s*\([^)]*spikes" "$dir" ; then
                  fail "$dir/ contains add_subdirectory targeting spikes/ (spike-spec §2)"
              fi
          done

          echo "--- Invariant 3: spike CMakeLists must not link main repo targets"
          if grep -rnE "scau::|GTest::" spikes/*/CMakeLists.txt ; then
              fail "spike CMakeLists links a main-repo CMake target (spike-spec §2)"
          fi

          echo "--- Invariant 4: no top-level vendor source under git tracking"
          if git ls-files | grep -E "^(Delft3D-main|Stormwater-Management-Model-develop)/" ; then
              fail "top-level vendor source committed (§3.3)"
          fi

          echo "OK all four spike-isolation invariants pass"
